<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väderkollen</title>
</head>
<body>

  <!-- STEG 1: Struktur. Allt som JavaScript ska fylla har ett id. -->
  <header class="topbar">
    <div class="logo">☀️ Väderkollen</div>

    <form id="search-form" class="search">
      <input id="city-input" type="text" placeholder="Sök stad, t.ex. Hudiksvall" autocomplete="off" required>
      <button type="submit">Sök</button>
      <button type="button" id="geo-btn" title="Använd min plats">📍</button>
    </form>
  </header>

  <main class="container">

    <!-- Meddelanden: laddar / fel -->
    <p id="status" class="status"></p>

    <!-- STEG 2: Kortet för aktuellt väder (dolt tills vi har data) -->
    <section id="current" class="card current hidden">
      <div class="current-head">
        <div>
          <p id="date" class="muted"></p>
          <h1 id="city-name"></h1>
        </div>
        <img id="weather-icon" alt="">
      </div>

      <div class="temp-row">
        <span id="temp" class="temp"></span>
        <div>
          <p id="description" class="description"></p>
          <p id="feels-like" class="muted"></p>
        </div>
      </div>

      <ul class="details">
        <li><span>💨 Vind</span><strong id="wind"></strong></li>
        <li><span>💧 Luftfuktighet</span><strong id="humidity"></strong></li>
        <li><span>🧭 Lufttryck</span><strong id="pressure"></strong></li>
        <li><span>👁️ Sikt</span><strong id="visibility"></strong></li>
        <li><span>🌅 Soluppgång</span><strong id="sunrise"></strong></li>
        <li><span>🌇 Solnedgång</span><strong id="sunset"></strong></li>
      </ul>
    </section>

    <!-- STEG 3: Prognos för kommande dagar -->
    <section id="forecast-section" class="card hidden">
      <h2>5-dygnsprognos</h2>
      <div id="forecast" class="forecast"></div>
    </section>

  </main>

  <footer class="footer">
    Data från <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a>
  </footer>

  <!-- Vite kompilerar TypeScript åt oss. CSS importeras i main.ts -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
